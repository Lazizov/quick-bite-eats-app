
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панель - Каусар</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginContainer">
        <div class="login-form">
            <h1>🔐 Админ панель</h1>
            <p>Авторизация для доступа к панели управления</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" required placeholder="Введите логин">
                </div>
                <div class="input-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="login-btn">Войти</button>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel" style="display: none;">
        <header class="admin-header">
            <h1>🍽️ Админ панель ресторана "Каусар"</h1>
            <div class="header-buttons">
                <button class="back-btn" onclick="window.location.href='index.html'">← На сайт</button>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </header>

        <div class="admin-content">
            <nav class="admin-nav">
                <button class="nav-btn active" onclick="showSection('categories')" id="categoriesNavBtn">
                    📂 Категории
                </button>
                <button class="nav-btn" onclick="showSection('items')" id="itemsNavBtn">
                    🍕 Блюда
                </button>
                <button class="nav-btn" onclick="showSection('orders')" id="ordersNavBtn">
                    📋 Заказы
                </button>
            </nav>

            <!-- Categories Section -->
            <div class="admin-section" id="categoriesSection">
                <div class="section-header">
                    <h2>Управление категориями</h2>
                    <button class="add-btn" onclick="showAddCategoryForm()">+ Добавить категорию</button>
                </div>

                <div class="add-form" id="addCategoryForm" style="display: none;">
                    <h3>Добавить новую категорию</h3>
                    <form id="categoryForm">
                        <div class="form-row">
                            <div class="input-group">
                                <label for="categoryName">Название категории</label>
                                <input type="text" id="categoryName" required placeholder="Например: Пицца">
                            </div>
                            <div class="input-group">
                                <label for="categoryImageInput">Изображение категории</label>
                                <input type="file" id="categoryImageInput" accept="image/*" required>
                                <img id="categoryImagePreview" style="display: none; width: 100px; height: 100px; object-fit: cover; border-radius: 8px; margin-top: 10px;">
                            </div>
                        </div>
                        <div class="form-buttons">
                            <button type="button" class="cancel-btn" onclick="hideAddCategoryForm()">Отмена</button>
                            <button type="submit" class="save-btn">Сохранить</button>
                        </div>
                    </form>
                </div>

                <div class="items-list" id="categoriesList">
                    <!-- Categories will be loaded here -->
                </div>
            </div>

            <!-- Items Section -->
            <div class="admin-section" id="itemsSection" style="display: none;">
                <div class="section-header">
                    <h2>Управление блюдами</h2>
                    <button class="add-btn" onclick="showAddItemForm()">+ Добавить блюдо</button>
                </div>

                <div class="add-form" id="addItemForm" style="display: none;">
                    <h3>Добавить новое блюдо</h3>
                    <form id="itemForm">
                        <div class="form-row">
                            <div class="input-group">
                                <label for="itemName">Название блюда</label>
                                <input type="text" id="itemName" required placeholder="Например: Маргарита">
                            </div>
                            <div class="input-group">
                                <label for="itemCategory">Категория</label>
                                <select id="itemCategory" required>
                                    <option value="">Выберите категорию</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="input-group">
                                <label for="itemPrice">Цена (₸)</label>
                                <input type="number" id="itemPrice" required placeholder="2500" min="0">
                            </div>
                            <div class="input-group">
                                <label for="itemImageInput">Изображение блюда</label>
                                <input type="file" id="itemImageInput" accept="image/*" required>
                                <img id="itemImagePreview" style="display: none; width: 100px; height: 100px; object-fit: cover; border-radius: 8px; margin-top: 10px;">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="itemDescription">Описание</label>
                            <textarea id="itemDescription" required placeholder="Описание блюда" rows="3"></textarea>
                        </div>
                        <div class="form-buttons">
                            <button type="button" class="cancel-btn" onclick="hideAddItemForm()">Отмена</button>
                            <button type="submit" class="save-btn">Сохранить</button>
                        </div>
                    </form>
                </div>

                <div class="items-list" id="itemsList">
                    <!-- Items will be loaded here -->
                </div>
            </div>

            <!-- Orders Section -->
            <div class="admin-section" id="ordersSection" style="display: none;">
                <div class="section-header">
                    <h2>Управление заказами</h2>
                    <div class="stats">
                        <span class="stat-item">📊 Всего заказов: <span id="totalOrders">0</span></span>
                        <span class="stat-item">🆕 Новых: <span id="newOrders">0</span></span>
                        <span class="stat-item">👨‍🍳 Готовятся: <span id="preparingOrders">0</span></span>
                    </div>
                </div>

                <div class="items-list" id="ordersList">
                    <!-- Orders will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <style>
        .order-card {
            border-left: 4px solid #3498db;
        }
        
        .order-card.new {
            border-left-color: #e74c3c;
        }
        
        .order-card.preparing {
            border-left-color: #f39c12;
        }
        
        .order-card.ready {
            border-left-color: #27ae60;
        }
        
        .order-card.delivered {
            border-left-color: #95a5a6;
        }
        
        .order-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .order-status.new {
            background: #e74c3c;
            color: white;
        }
        
        .order-status.preparing {
            background: #f39c12;
            color: white;
        }
        
        .order-status.ready {
            background: #27ae60;
            color: white;
        }
        
        .order-status.delivered {
            background: #95a5a6;
            color: white;
        }
        
        .order-items ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .order-items li {
            margin: 5px 0;
        }
        
        .status-select {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-left: 20px;
        }
        
        .stat-item {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        
        input[type="file"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
    </style>

    <script src="admin-script.js"></script>
</body>
</html>
