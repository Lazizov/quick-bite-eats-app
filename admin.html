
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панель - Каусар</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginContainer">
        <div class="login-form">
            <h1>🔐 Админ панель</h1>
            <p>Авторизация для доступа к панели управления</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" required placeholder="Введите логин">
                </div>
                <div class="input-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="login-btn">Войти</button>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel" style="display: none;">
        <header class="admin-header">
            <h1>🍽️ Админ панель ресторана "Каусар"</h1>
            <div class="header-buttons">
                <button class="back-btn" onclick="window.location.href='index.html'">← На сайт</button>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </header>

        <div class="admin-content">
            <nav class="admin-nav">
                <button class="nav-btn active" onclick="showSection('categories')" id="categoriesNavBtn">
                    📂 Категории
                </button>
                <button class="nav-btn" onclick="showSection('items')" id="itemsNavBtn">
                    🍕 Блюда
                </button>
            </nav>

            <!-- Categories Section -->
            <div class="admin-section" id="categoriesSection">
                <div class="section-header">
                    <h2>Управление категориями</h2>
                    <button class="add-btn" onclick="showAddCategoryForm()">+ Добавить категорию</button>
                </div>

                <div class="add-form" id="addCategoryForm" style="display: none;">
                    <h3>Добавить новую категорию</h3>
                    <form id="categoryForm">
                        <div class="form-row">
                            <div class="input-group">
                                <label for="categoryName">Название категории</label>
                                <input type="text" id="categoryName" required placeholder="Например: Пицца">
                            </div>
                            <div class="input-group">
                                <label for="categoryEmoji">Эмодзи для категории</label>
                                <input type="text" id="categoryEmoji" required placeholder="🍕" maxlength="2">
                            </div>
                        </div>
                        <div class="form-buttons">
                            <button type="button" class="cancel-btn" onclick="hideAddCategoryForm()">Отмена</button>
                            <button type="submit" class="save-btn">Сохранить</button>
                        </div>
                    </form>
                </div>

                <div class="items-list" id="categoriesList">
                    <!-- Categories will be loaded here -->
                </div>
            </div>

            <!-- Items Section -->
            <div class="admin-section" id="itemsSection" style="display: none;">
                <div class="section-header">
                    <h2>Управление блюдами</h2>
                    <button class="add-btn" onclick="showAddItemForm()">+ Добавить блюдо</button>
                </div>

                <div class="add-form" id="addItemForm" style="display: none;">
                    <h3>Добавить новое блюдо</h3>
                    <form id="itemForm">
                        <div class="form-row">
                            <div class="input-group">
                                <label for="itemName">Название блюда</label>
                                <input type="text" id="itemName" required placeholder="Например: Маргарита">
                            </div>
                            <div class="input-group">
                                <label for="itemCategory">Категория</label>
                                <select id="itemCategory" required>
                                    <option value="">Выберите категорию</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="input-group">
                                <label for="itemPrice">Цена (₸)</label>
                                <input type="number" id="itemPrice" required placeholder="2500" min="0">
                            </div>
                            <div class="input-group">
                                <label for="itemImage">URL изображения</label>
                                <input type="url" id="itemImage" placeholder="https://example.com/image.jpg">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="itemDescription">Описание</label>
                            <textarea id="itemDescription" required placeholder="Описание блюда" rows="3"></textarea>
                        </div>
                        <div class="form-buttons">
                            <button type="button" class="cancel-btn" onclick="hideAddItemForm()">Отмена</button>
                            <button type="submit" class="save-btn">Сохранить</button>
                        </div>
                    </form>
                </div>

                <div class="items-list" id="itemsList">
                    <!-- Items will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
